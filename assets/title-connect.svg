<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="06 CONNECT: Let's build something rigorous.">
  <defs>
    <linearGradient id="tn-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset=".4" stop-color="#1D4ED8"/>
      <stop offset=".8" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tn-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#93C5FD"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="tn-pulse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#60A5FA" stop-opacity=".7"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .tn-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tn-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tn-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tn-in { animation: tn-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tn-d2 { animation-delay: .2s; } .tn-d3 { animation-delay: .45s; }
    .tn-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: tn-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes tn-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes tn-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tn-in { animation: none; } .tn-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g class="tn-in">
    <text class="tn-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#60A5FA"><tspan fill="#93C5FD">06</tspan>   CONNECT</text>
  </g>
  <g class="tn-in tn-d2">
    <text class="tn-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#F8FAFC">Let's build something <tspan font-style="italic" fill="url(#tn-sheen)">rigorous.</tspan></text>
  </g>
  <g class="tn-in tn-d3">
    <text class="tn-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#94A3B8">GET IN TOUCH</text>
  </g>
  <path class="tn-draw" d="M40 106 H1160" stroke="url(#tn-line)" stroke-width="1.2"/>
  <circle cx="40" cy="106" r="6" fill="url(#tn-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
