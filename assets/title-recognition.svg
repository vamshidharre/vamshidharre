<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="02 RECOGNITION: Proof, on the record.">
  <defs>
    <linearGradient id="tr-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset=".4" stop-color="#1D4ED8"/>
      <stop offset=".8" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tr-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="tr-pulse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#60A5FA" stop-opacity=".7"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .tr-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .tr-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tr-in { animation: tr-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tr-d2 { animation-delay: .2s; } .tr-d3 { animation-delay: .45s; }
    .tr-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: tr-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes tr-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes tr-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tr-in { animation: none; } .tr-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g class="tr-in">
    <text class="tr-mono" x="40" y="34" font-size="11.5" font-weight="700" letter-spacing="2.6" fill="#60A5FA"><tspan fill="#93C5FD">02</tspan>   RECOGNITION</text>
  </g>
  <g class="tr-in tr-d2">
    <text class="tr-sans" x="38" y="82" font-size="38" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">Proof, on the <tspan fill="url(#tr-sheen)">record.</tspan></text>
  </g>
  <g class="tr-in tr-d3">
    <text class="tr-mono" x="1160" y="34" text-anchor="end" font-size="10.5" font-weight="600" letter-spacing="2.2" fill="#94A3B8">IMPACT &amp; TRACK RECORD</text>
  </g>
  <path class="tr-draw" d="M40 104 H1160" stroke="url(#tr-line)" stroke-width="1.4"/>
  <circle cx="40" cy="104" r="5" fill="url(#tr-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
